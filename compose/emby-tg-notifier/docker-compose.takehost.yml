services:
  emby-tg-notifier:
    build: .
    container_name: emby-tg-notifier
    restart: unless-stopped
    ports:
      - "8787:8787"
    volumes:
      - ./data:/data
    environment:
      - TZ=Asia/Shanghai
      - DB_PATH=/data/app.db
      - SESSION_SECRET_FILE=/data/session_secret
      - SESSION_HTTPS_ONLY=0
