name: Test rclone sync web

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/rclone-sync-web.py"
      - "scripts/install-rclone-sync-web.sh"
      - "systemd/rclone-sync-web.service"
      - "setup-wizard.sh"
      - "healthcheck.sh"
      - ".github/workflows/test-rclone-sync-web.yml"

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install runtime packages
        run: |
          sudo apt-get update
          sudo apt-get install -y rclone python3-flask

      - name: Check Python and shell syntax
        run: |
          python3 -m py_compile scripts/rclone-sync-web.py
          bash -n scripts/install-rclone-sync-web.sh
          bash -n setup-wizard.sh
          bash -n healthcheck.sh

      - name: Test every sync setting persists
        run: |
          sudo python3 - <<'PY'
          import importlib.util
          import json
          import re
          from pathlib import Path

          spec = importlib.util.spec_from_file_location(
              "rclone_sync_web", "scripts/rclone-sync-web.py"
          )
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          module.SETTINGS_FILE = Path("/tmp/rclone-sync-settings-test.json")
          module.LOG_FILE = Path("/tmp/rclone-sync-live-test.log")
          module.settings = module.settings.copy()
          module.settings["must_change_password"] = False
          module.rclone_remotes = lambda: ["test_remote"]
          module.validate_local_path = lambda value: value
          client = module.app.test_client()
          with client.session_transaction() as session:
              session["user"] = module.settings["username"]
              session["csrf"] = "test-csrf"

          response = client.post(
              "/save-sync",
              data={
                  "csrf": "test-csrf",
                  "remote": "test_remote",
                  "remote_path": "backup/movies",
                  "local_path": "/home/symedia_gd/movies",
                  "interval_minutes": "37",
                  "transfers": "7",
                  "checkers": "13",
                  "mode": "sync",
                  "metadata_only": "on",
                  "enabled": "on",
                  "confirm_mirror": "on",
              },
          )
          assert response.status_code == 302
          saved = json.loads(module.SETTINGS_FILE.read_text())
          expected = {
              "remote": "test_remote",
              "remote_path": "backup/movies",
              "local_path": "/home/symedia_gd/movies",
              "interval_minutes": 37,
              "transfers": 7,
              "checkers": 13,
              "mode": "sync",
              "metadata_only": True,
              "enabled": True,
              "confirm_mirror": True,
          }
          assert all(saved[key] == value for key, value in expected.items())
          dashboard = client.get("/").get_data(as_text=True)
          assert re.search(r'name="confirm_mirror"[^>]*checked', dashboard)

          response = client.post(
              "/save-sync",
              data={
                  "csrf": "test-csrf",
                  "remote": "test_remote",
                  "remote_path": "backup/movies",
                  "local_path": "/home/symedia_gd/movies",
                  "interval_minutes": "10",
                  "transfers": "4",
                  "checkers": "8",
                  "mode": "copy",
              },
          )
          assert response.status_code == 302
          saved = json.loads(module.SETTINGS_FILE.read_text())
          assert saved["mode"] == "copy"
          assert saved["metadata_only"] is False
          assert saved["enabled"] is False
          assert saved["confirm_mirror"] is False

          response = client.post(
              "/save-sync",
              data={
                  "csrf": "test-csrf",
                  "remote": "test_remote",
                  "remote_path": "backup/movies",
                  "local_path": "/home/symedia_gd/movies",
                  "interval_minutes": "10",
                  "transfers": "4",
                  "checkers": "8",
                  "mode": "sync",
              },
          )
          assert response.status_code == 302
          saved = json.loads(module.SETTINGS_FILE.read_text())
          assert saved["mode"] == "copy"

          module.LOG_FILE.write_text(
              "\n".join(f"line-{index:04d}" for index in range(1000)),
              encoding="utf-8",
          )
          module.state.update(
              {
                  "running": True,
                  "pid": 12345,
                  "last_started": "2026-07-26T10:00:00",
                  "last_finished": None,
                  "last_exit_code": None,
                  "last_message": "正在同步测试",
              }
          )
          live = client.get("/api/live")
          assert live.status_code == 200
          live_data = live.get_json()
          assert live_data["status"]["running"] is True
          assert live_data["status"]["pid"] == 12345
          assert "line-0999" in live_data["log"]
          assert "line-0000" not in live_data["log"]
          dashboard = client.get("/").get_data(as_text=True)
          assert 'id="sync-log"' in dashboard
          assert "setInterval(refreshLiveStatus, 2000)" in dashboard

          module.SETTINGS_FILE.unlink()
          module.LOG_FILE.unlink()
          PY

      - name: Smoke test web service
        run: |
          sudo env RCLONE_SYNC_INITIAL_USER=admin \
            RCLONE_SYNC_INITIAL_PASSWORD=admin \
            python3 scripts/rclone-sync-web.py --init
          sudo python3 scripts/rclone-sync-web.py \
            --host 127.0.0.1 --port 16096 >/tmp/rclone-sync-web.log 2>&1 &
          server_pid=$!
          trap 'sudo kill "${server_pid}" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:16096/healthz |
              grep -q '"ok":true'; then
              break
            fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:16096/healthz |
            grep -q '"ok":true'
          curl -fsS http://127.0.0.1:16096/login |
            grep -q '登录同步控制台'
