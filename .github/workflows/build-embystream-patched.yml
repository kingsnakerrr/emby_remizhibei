name: Build patched EmbyStream

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build-embystream-patched.yml"
      - "patches/embystream-v0.0.43-refresh-scheduler.patch"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out installer
        uses: actions/checkout@v4

      - name: Check out upstream EmbyStream
        uses: actions/checkout@v4
        with:
          repository: PiliPili-Team/EmbyStream
          ref: 43cb11f6cbc24806116f203e6860ce31d6a4df09
          path: upstream

      - name: Apply audited scheduler patch
        run: git -C upstream apply ../patches/embystream-v0.0.43-refresh-scheduler.patch

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.85"

      - name: Test scheduler and build release
        working-directory: upstream
        run: |
          cargo test --locked core::backend::google_drive_auth
          cargo build --release --locked

      - name: Package and checksum
        run: |
          install -D -m 0755 upstream/target/release/embystream dist/embystream
          tar -C dist -czf embystream-amd64-linux.tar.gz embystream
          sha512sum embystream-amd64-linux.tar.gz > embystream.sha512sum

      - name: Publish reproducible patched release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="embystream-v0.0.43-p1"
          gh release view "$tag" >/dev/null 2>&1 ||
            gh release create "$tag" \
              --title "EmbyStream v0.0.43-p1 scheduler hotfix" \
              --notes "Upstream v0.0.43 (43cb11f) plus the tracked refresh-scheduler backoff and minimum-sleep patch."
          gh release upload "$tag" \
            embystream-amd64-linux.tar.gz embystream.sha512sum --clobber
